name: 品質チェック

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Python品質チェック
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v7

      - name: uvをセットアップ
        uses: astral-sh/setup-uv@v9
        with:
          version: "0.12.21"
          enable-cache: true

      - name: Pythonをセットアップ
        run: uv python install

      - name: 依存関係を同期
        run: uv sync --locked --all-extras --dev

      - name: Ruffでコード品質を確認
        run: uv run ruff check .

      - name: Ruffでフォーマットを確認
        run: uv run ruff format --check .

      - name: mypyで型を確認
        run: uv run mypy

      - name: pytestでテストを実行
        run: uv run pytest -v