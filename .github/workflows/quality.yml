name: 品質チェック

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Python品質チェック
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: uvをセットアップ
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          enable-cache: true

      - name: Pythonをセットアップ
        run: uv python install

      - name: 依存関係を同期
        run: uv sync --locked --all-extras --dev

      - name: Ruffでコード品質を確認
        run: uv run ruff check .

      - name: Ruffでフォーマットを確認
        run: uv run ruff format --check .

      - name: mypyで型を確認
        run: uv run mypy

      - name: pytestでテストを実行
        run: uv run pytest -v